name: Deploy docs to Cloudflare

# Deployment stays disabled until a maintainer enables the repository variable.
# Run manually from main; this workflow never accepts a caller-supplied ref.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  check:
    name: Verify the trusted commit
    if: >-
      github.repository == 'leafliber/coopanion-guide-website' &&
      github.ref == 'refs/heads/main' &&
      vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - name: Check out the exact dispatch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Require the production site address
        run: |
          if [ -z "$DOCS_SITE_URL" ]; then
            echo 'Set the DOCS_SITE_URL repository variable before deploying.' >&2
            exit 1
          fi
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Check content, build, and validate links, assets, and search
        run: pnpm docs:verify

  deploy:
    name: Deploy verified static assets
    needs: check
    if: >-
      github.repository == 'leafliber/coopanion-guide-website' &&
      github.ref == 'refs/heads/main' &&
      vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure this environment to allow only the main branch, with the two
    # Cloudflare secrets below. Review protection is recommended before enabling.
    environment: docs-production
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
    steps:
      - name: Check out the same verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      # Rebuild and recheck this SHA, without importing artifacts or caches
      # from other workflow runs. No Cloudflare credentials are available here.
      - name: Rebuild and verify the deployment output
        run: pnpm docs:verify
      - name: Validate the production address and deploy static assets
        run: pnpm docs:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
